server:
  port: 8080
  apiVersion: "v1"

storage:
  type: "firestore"
  projectsDirectory: "./projects"
  gcpProjectId: "planner-app-66733"
  firestoreDatabase: "(default)"

scheduler:
  enabled: true
  intervalMinutes: 1440 # 24 hours (daily)
  sweepOnStartup: false

email:
  mode: "logger" # logger | smtp
  fromAddress: "noreply@planner.internal"
  smtp:
    host: "localhost"
    port: 587
    username: ""
    password: ""
