name: Daily Task Reminder & Scheduler Sweep

on:
  schedule:
    # 10:00 AM IST (Indian Standard Time / Bengaluru) = 04:30 UTC
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      trigger_cloud_run:
        description: 'Also trigger live Cloud Run service endpoint'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  daily-reminder-sweep:
    name: Scan Tasks & Dispatch Reminders
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: 'planner-app-66733'
      BUCKET_NAME: 'planner-app-66733-data'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: worker/go.sum

      # 1. Authenticate to Google Cloud if secret is present
      - name: Authenticate to Google Cloud
        if: env.GCP_SA_KEY != ''
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: env.GCP_SA_KEY != ''
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        uses: google-github-actions/setup-gcloud@v2

      # 2. Sync latest persistent project & task YAML files from Google Cloud Storage
      - name: Sync Tasks from Persistent GCS Bucket
        if: env.GCP_SA_KEY != ''
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "📥 Syncing latest tasks from gs://$BUCKET_NAME to worker/projects/..."
          mkdir -p worker/projects
          gcloud storage cp -r "gs://${BUCKET_NAME}/*" worker/projects/ || true

      # 3. Trigger live Cloud Run service endpoint in asia-south1
      - name: Trigger Live Cloud Run Scheduler Endpoint
        if: ${{ github.event_name == 'schedule' || inputs.trigger_cloud_run == true }}
        run: |
          echo "### 🌐 Triggering Cloud Run Service (asia-south1)..."
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://planner-service-715525810343.asia-south1.run.app/api/v1/scheduler/trigger" \
            -H "Content-Type: application/json" \
            -H "x-request-id: req-ci-daily-$(date +%s)")
          
          STATUS_CODE=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$HTTP_RESPONSE" | sed '/HTTP_STATUS:/d')
          
          echo "Response Status: $STATUS_CODE"
          echo "Response Body: $BODY"
          
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "✅ Live Cloud Run scheduler trigger succeeded!"
          else
            echo "⚠️ Cloud Run trigger returned status $STATUS_CODE (continuing with local repository sweep)"
          fi

      # 4. Execute Go sweep engine to scan projects and dispatch reminder emails / step summary
      - name: Execute Pending Tasks Sweep & Send Digest Emails
        env:
          EMAIL_MODE: ${{ secrets.SMTP_HOST != '' && 'smtp' || 'logger' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PROJECTS_DIR: "./projects"
        run: |
          cd worker
          go run server/main.go --sweep-only
