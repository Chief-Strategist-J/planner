# ==============================================================================
# TOP-LEVEL ALGORITHM BLUEPRINT: DAILY TASK REMINDER & SCHEDULER SWEEP
# ==============================================================================
# 1. Trigger Matrix:
#    - Scheduled via cron at 04:30 UTC (10:00 AM IST), daily.
#    - Supports manual execution via workflow dispatch.
# 2. Remote Trigger Phase:
#    - Issues HTTP POST request to Cloud Run scheduler endpoint (/api/v1/scheduler/trigger).
#    - Parses JSON response to extract scanned projects, pending tasks, and dispatched email counts.
# 3. Reporting & Audit Phase:
#    - Queries projects and pending tasks endpoints via REST API.
#    - Formats and writes detailed Markdown summary table to GitHub Step Summary.
# ==============================================================================
name: Daily Task Reminder & Scheduler Sweep

on:
  schedule:
    - cron: '48 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-reminder-sweep:
    name: Trigger Cloud Scheduler & Generate Daily Digest
    runs-on: ubuntu-latest

    env:
      BASE_URL: 'https://planner-service-715525810343.asia-south1.run.app'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trigger Live Cloud Run Sweep Engine
        id: trigger_sweep
        run: |
          echo "### 🌐 Triggering Cloud Run Sweep Endpoint..."
          REQ_ID="req-daily-$(date +%s)"
          
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${BASE_URL}/api/v1/scheduler/trigger" \
            -H "Content-Type: application/json" \
            -H "x-request-id: ${REQ_ID}")
          
          STATUS_CODE=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$HTTP_RESPONSE" | sed '/HTTP_STATUS:/d')
          
          echo "Response Status: $STATUS_CODE"
          echo "Response Body: $BODY"
          
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "❌ Failed to trigger Cloud Run scheduler (Status: $STATUS_CODE)"
            exit 1
          fi
          
          SCANNED_PROJECTS=$(echo "$BODY" | jq -r '.data.scannedProjects // 0')
          PENDING_TASKS=$(echo "$BODY" | jq -r '.data.pendingTasksFound // 0')
          EMAILS_SENT=$(echo "$BODY" | jq -r '.data.emailsDispatched // 0')
          
          echo "scanned_projects=$SCANNED_PROJECTS" >> $GITHUB_OUTPUT
          echo "pending_tasks=$PENDING_TASKS" >> $GITHUB_OUTPUT
          echo "emails_sent=$EMAILS_SENT" >> $GITHUB_OUTPUT

      - name: Query Live Projects & Format Step Summary
        run: |
          echo "# 📋 Daily Task Reminder Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Source:** Live Cloud Run Service (\`$BASE_URL\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC') (10:00 AM IST)" >> $GITHUB_STEP_SUMMARY
          echo "- **Projects Scanned:** ${{ steps.trigger_sweep.outputs.scanned_projects }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pending Tasks Found:** ${{ steps.trigger_sweep.outputs.pending_tasks }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest Emails Dispatched:** ${{ steps.trigger_sweep.outputs.emails_sent }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          PROJECTS_JSON=$(curl -s -H "x-request-id: req-summary-$(date +%s)" "${BASE_URL}/api/v1/projects")
          PROJECT_COUNT=$(echo "$PROJECTS_JSON" | jq -r '.data | length // 0')
          
          if [ "$PROJECT_COUNT" -eq 0 ]; then
            echo "ℹ️ *No projects currently registered in Cloud Storage.*" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 📂 Active Projects & Tasks Overview" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Project ID | Name | Status | Pending Tasks |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
            
            for row in $(echo "$PROJECTS_JSON" | jq -r '.data[] | @base64'); do
              _jq() {
                echo ${row} | base64 --decode | jq -r ${1}
              }
              PROJ_ID=$(_jq '.projectId')
              PROJ_NAME=$(_jq '.name')
              PROJ_STATUS=$(_jq '.status')
              
              TASKS_JSON=$(curl -s -H "x-request-id: req-tasks-${PROJ_ID}" "${BASE_URL}/api/v1/projects/${PROJ_ID}/tasks?status=PENDING")
              TASK_COUNT=$(echo "$TASKS_JSON" | jq -r '.data | length // 0')
              
              echo "| \`$PROJ_ID\` | **$PROJ_NAME** | \`$PROJ_STATUS\` | **$TASK_COUNT** pending |" >> $GITHUB_STEP_SUMMARY
            done
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "✅ *Daily reminder sweep executed successfully against persistent cloud storage.*" >> $GITHUB_STEP_SUMMARY
