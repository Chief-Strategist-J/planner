name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Test Go Backend & Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: worker/go.sum

      - name: Run Go Unit and Integration Tests
        run: |
          cd worker
          go test -count=1 -v ./...

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"

      - name: Validate Terraform Configuration
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform validate
