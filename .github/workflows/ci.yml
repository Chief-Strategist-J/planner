# ==============================================================================
# TOP-LEVEL ALGORITHM BLUEPRINT: CONTINUOUS INTEGRATION PIPELINE
# ==============================================================================
# 1. Event Triggers:
#    - Activates on code push or pull request to the main branch.
#    - Supports manual execution via workflow_dispatch.
# 2. Environment Provisioning:
#    - Checks out repository source code.
#    - Configures Go 1.25 environment with dependency caching.
# 3. Unit & Integration Test Execution:
#    - Executes complete Go test suite across all feature packages and repositories.
# 4. Infrastructure Configuration Validation:
#    - Sets up Terraform CLI.
#    - Initializes providers without remote backend.
#    - Validates declarative HCL syntax and schema consistency.
# ==============================================================================
name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Test Go Backend & Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: worker/go.sum

      - name: Run Go Unit and Integration Tests
        run: |
          cd worker
          go test -count=1 -v ./...

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Validate Terraform Configuration
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform validate
